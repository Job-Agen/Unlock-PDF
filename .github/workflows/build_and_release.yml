name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows (64-bit)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0.0

      - name: Run automated PRD test suite
        run: |
          python tests/test_mvp_prd.py -v

      - name: Compile Windows executable (.exe)
        run: |
          python build_windows.py

      - name: Package distribution archive (.zip)
        run: |
          python package_release.py

      - name: Verify generated artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/
          $shaContent = Get-Content dist/PDF_Unlocker_MVP_1.0.exe.sha256
          Write-Host "Empreinte SHA-256 officielle : $shaContent"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "PDF Unlocker Desktop ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PDF_Unlocker_MVP_1.0.exe
            dist/PDF_Unlocker_MVP_1.0.exe.sha256
            dist/PDF_Unlocker_v1.0.0_Windows_x64.zip
            dist/README_DISTRIBUTION.txt

